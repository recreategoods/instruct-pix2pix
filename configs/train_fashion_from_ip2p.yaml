# Fashion Edit Dataset Training Configuration
# Starting from InstructPix2Pix checkpoint instead of base Stable Diffusion

model:
  base_learning_rate: 1.0e-04
  target: ldm.models.diffusion.ddpm_edit.LatentDiffusion
  params:
    ckpt_path: checkpoints/instruct-pix2pix-00-22000.ckpt  # InstructPix2Pix checkpoint
    linear_start: 0.00085
    linear_end: 0.0120
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: edited
    cond_stage_key: edit
    image_size: 32
    channels: 4
    cond_stage_trainable: false
    conditioning_key: hybrid
    monitor: val/loss_simple_ema
    scale_factor: 0.18215
    use_ema: true
    load_ema: false

    scheduler_config: # 10000 warmup steps
      target: ldm.lr_scheduler.LambdaLinearScheduler
      params:
        warm_up_steps: [ 0 ]
        cycle_lengths: [ 10000000000000 ] # incredibly large number to prevent corner cases
        f_start: [ 1.e-6 ]
        f_max: [ 1. ]
        f_min: [ 1. ]

    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 32 # unused
        in_channels: 8
        out_channels: 4
        model_channels: 320
        attention_resolutions: [ 4, 2, 1 ]
        num_res_blocks: 2
        channel_mult: [ 1, 2, 4, 4 ]
        num_heads: 8
        use_spatial_transformer: True
        transformer_depth: 1
        context_dim: 768
        use_checkpoint: True
        legacy: False

    first_stage_config:
      target: ldm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        monitor: val/rec_loss
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    cond_stage_config:
      target: ldm.modules.encoders.modules.FrozenCLIPEmbedder

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 32  # Per GPU batch size - effective batch size will be 32 * 8 = 256
    num_workers: 8  # Increased for better data loading with 8 GPUs
    train:
      target: edit_dataset.EditDataset
      params:
        path: data/fashion-edit-dataset
        split: train
        min_resize_res: 256
        max_resize_res: 256
        crop_res: 256
        flip_prob: 0.5
    validation:
      target: edit_dataset.EditDataset
      params:
        path: data/fashion-edit-dataset
        split: val
        min_resize_res: 256
        max_resize_res: 256
        crop_res: 256

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 1000  # Log images every 1000 steps (more frequent for monitoring)
        max_images: 2  # 2 images per GPU = 16 total for 8 GPUs
        increase_log_steps: False

  trainer:
    max_epochs: 50  # Reduced since starting from InstructPix2Pix (should converge faster)
    benchmark: True
    accumulate_grad_batches: 2  # Reduced from 4 since we have 8 GPUs (effective batch size: 32*8*2=512)
    check_val_every_n_epoch: 2  # More frequent validation
    precision: 32  # Use FP32 for stability (mixed precision has model compatibility issues)
    # Add distributed training settings
    strategy: ddp
    sync_batchnorm: true